<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Cyber Hub | 2000s Nostalgia</title>
    <style>
        :root {
            --xp-blue: #245edb;
            --xp-green: #4c8b2b;
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-glow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: url('https://cur.cursors-4u.net/ani/ani-1/ani1.ani'), auto !important;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            background-attachment: fixed;
            color: #f8fafc;
            font-family: 'Tahoma', 'Segoe UI', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Scanline Overlay for CRT feel */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 10;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }

        .ambient-bg {
            position: fixed;
            top: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(36, 94, 219, 0.15) 0%, transparent 70%);
            z-index: -1;
        }

        header {
            position: absolute;
            top: 40px;
            text-align: center;
            z-index: 5;
        }

        h1 {
            font-size: 3.5rem;
            letter-spacing: -2px;
            text-transform: uppercase;
            font-weight: 900;
            background: linear-gradient(to bottom, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.3));
        }

        .status-tag {
            display: inline-block;
            background: var(--xp-green);
            color: white;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-top: 10px;
            box-shadow: 0 0 10px rgba(76, 139, 43, 0.4);
            animation: pulse 2s infinite;
        }

        /* Central CRT Visual */
        .crt-container {
            position: relative;
            width: 600px;
            max-width: 90vw;
            height: 450px;
            background: #222;
            border-radius: 40px;
            border: 15px solid #333;
            box-shadow: 0 50px 100px -20px rgba(0,0,0,0.8), inset 0 0 50px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .crt-container:hover {
            transform: scale(1.02) rotateX(2deg);
        }

        .screen {
            width: 95%;
            height: 92%;
            background: #000;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            border: 4px solid #111;
        }

        .xp-desktop {
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1614850523296-d8c1af93d400?auto=format&fit=crop&q=80&w=1000') center/cover;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .window-messenger {
            background: #f1f1f1;
            width: 200px;
            height: 280px;
            border-radius: 4px 4px 0 0;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.3);
            border: 1px solid #003399;
        }

        .window-header {
            background: linear-gradient(to right, #003399, #0055ff);
            color: white;
            padding: 5px 10px;
            font-size: 0.7rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-content {
            padding: 10px;
            color: #333;
            font-size: 0.75rem;
        }

        .chat-bubble {
            background: #fff;
            border: 1px solid #ccc;
            padding: 5px;
            margin-bottom: 5px;
            border-radius: 4px;
        }

        /* Floating Details */
        .sticky-note {
            position: absolute;
            padding: 15px;
            background: #fef08a;
            color: #854d0e;
            transform: rotate(-5deg);
            box-shadow: 5px 5px 10px rgba(0,0,0,0.2);
            font-weight: bold;
            z-index: 20;
            pointer-events: none;
        }

        .rate-tag { top: 15%; right: -10%; transform: rotate(10deg); }
        .gaming-tag { bottom: 20%; left: -10%; background: #fb7185; color: white; transform: rotate(-15deg); }

        /* Rotating Quotes */
        .quote-box {
            position: absolute;
            bottom: 120px;
            text-align: center;
            width: 100%;
            height: 30px;
        }

        #quote-text {
            font-style: italic;
            color: #94a3b8;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        /* Glassmorphism Player */
        .player-bar {
            position: fixed;
            bottom: 30px;
            width: 600px;
            max-width: 95vw;
            height: 80px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            display: flex;
            align-items: center;
            padding: 0 25px;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .player-controls {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
        }

        .btn:hover { transform: scale(1.1); color: var(--xp-blue); }

        .btn-play {
            width: 45px;
            height: 45px;
            background: white;
            color: black;
            border-radius: 50%;
            justify-content: center;
        }

        .track-info {
            margin-left: 25px;
            flex-grow: 1;
        }

        .track-name {
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 4px;
            display: block;
            width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 35%;
            background: var(--xp-blue);
            box-shadow: 0 0 10px var(--xp-blue);
            transition: width 0.1s linear;
        }

        /* Animations */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Keyboard Click Visual Effect */
        .key-pop {
            position: absolute;
            color: var(--xp-blue);
            font-weight: bold;
            pointer-events: none;
            animation: keyFloat 0.6s ease-out forwards;
        }

        @keyframes keyFloat {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-50px) scale(1.5); opacity: 0; }
        }

        #youtube-player {
            display: none;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .crt-container { height: 300px; }
            .sticky-note { font-size: 0.7rem; padding: 10px; }
        }
    </style>
</head>
<body>

    <div class="ambient-bg"></div>

    <header>
        <h1>The Cyber Hub</h1>
        <div class="status-tag">STATION 04 - ONLINE</div>
    </header>

    <div class="sticky-note rate-tag">₹20 / HOUR<br><small>NO SMOKING</small></div>
    <div class="sticky-note gaming-tag">CS 1.6<br>TOURNAMENT<br>FRI 6PM</div>

    <div class="crt-container" id="main-crt">
        <div class="screen">
            <div class="xp-desktop">
                <div class="window-messenger">
                    <div class="window-header">
                        <span>Yahoo! Messenger</span>
                        <span>✕</span>
                    </div>
                    <div class="chat-content">
                        <div class="chat-bubble"><b>Cool_Guy89:</b> asl pls?</div>
                        <div class="chat-bubble"><b>Matrix_Neo:</b> 19/m/delhi u?</div>
                        <div class="chat-bubble" style="color: var(--xp-blue)"><b>Admin:</b> 5 mins left in your session!</div>
                    </div>
                </div>
                <!-- Mini browser window icon style -->
                <div style="background: rgba(255,255,255,0.7); width: 40px; height: 40px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 20px;">
                    🎮
                </div>
            </div>
        </div>
    </div>

    <div class="quote-box">
        <p id="quote-text">"Bhaiya, Winamp chala do..."</p>
    </div>

    <!-- Hidden YT Player -->
    <div id="youtube-player"></div>

    <footer class="player-bar">
        <div class="player-controls">
            <button class="btn" onclick="prevVideo()"><svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6L18 18V6z"/></svg></button>
            <button class="btn btn-play" id="play-trigger" onclick="togglePlay()">
                <svg id="play-icon" width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="btn" onclick="nextVideo()"><svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
        </div>
        <div class="track-info">
            <span class="track-name" id="track-name">Cafe Hits: English Popular Songs</span>
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>
        <div style="font-size: 0.7rem; color: #94a3b8; margin-left: 15px;">
            HIFI AUDIO
        </div>
    </footer>

    <!-- Audio for interaction -->
    <audio id="click-sound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const quotes = [
            '"Bhaiya, Counter Strike ka shortcut nahi mil raha!"',
            '"Google khulne mein 2 minute lag rahe hain..."',
            '"ASL please? 18/F/California?"',
            '"Yahoo Messenger is signed in."',
            '"Headphone check... Mic check... 1, 2, 3"',
            '"Disk format mat karna please!"',
            '"Bhaiya, time kitna bacha hai?"',
            '"Welcome to Orkut, tell your friends!"'
        ];

        let quoteIndex = 0;
        const quoteEl = document.getElementById('quote-text');

        function rotateQuote() {
            quoteEl.style.opacity = 0;
            setTimeout(() => {
                quoteEl.innerText = quotes[quoteIndex];
                quoteEl.style.opacity = 1;
                quoteIndex = (quoteIndex + 1) % quotes.length;
            }, 500);
        }
        setInterval(rotateQuote, 4000);
        rotateQuote();

        // Keyboard Interaction
        const clickSound = document.getElementById('click-sound');
        document.addEventListener('click', (e) => {
            clickSound.currentTime = 0;
            clickSound.play();
            
            const pop = document.createElement('div');
            pop.className = 'key-pop';
            pop.innerText = 'CLICK';
            pop.style.left = e.pageX + 'px';
            pop.style.top = e.pageY + 'px';
            document.body.appendChild(pop);
            setTimeout(() => pop.remove(), 600);
        });

        // YouTube Player Logic
        let player;
        const playlistId = 'PL4fGSI1pDJn6jWjghO6m8DtcCj76M0L3K'; // Popular English Hits Playlist

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '0',
                width: '0',
                playerVars: {
                    listType: 'playlist',
                    list: playlistId,
                    autoplay: 0,
                    controls: 0
                },
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function togglePlay() {
            const state = player.getPlayerState();
            const icon = document.getElementById('play-icon');
            if (state === 1) {
                player.pauseVideo();
                icon.innerHTML = '<path d="M8 5v14l11-7z"/>';
            } else {
                player.playVideo();
                icon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
            }
        }

        function nextVideo() { player.nextVideo(); }
        function prevVideo() { player.previousVideo(); }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                const data = player.getVideoData();
                document.getElementById('track-name').innerText = data.title;
                updateProgress();
            }
        }

        function updateProgress() {
            if (player && player.getCurrentTime) {
                const curr = player.getCurrentTime();
                const total = player.getDuration();
                const perc = (curr / total) * 100;
                document.getElementById('progress-bar').style.width = perc + '%';
            }
            requestAnimationFrame(updateProgress);
        }

        // CRT Screen mouse tracking effect
        const crt = document.getElementById('main-crt');
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            crt.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });
    </script>
</body>
</html>
