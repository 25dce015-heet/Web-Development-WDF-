<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>StudentHub - Registration</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        /* =================================
           SUCCESS POPUP
        ================================= */

        #successPopup {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.65);

            display: none;

            justify-content: center;
            align-items: center;

            z-index: 99999;
        }


        #successPopup.show {
            display: flex;
        }


        .success-box {
            background: white;

            width: 400px;
            max-width: 85%;

            padding: 35px;

            text-align: center;

            border-radius: 20px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.3);

            animation: popupAnimation 0.3s ease;
        }


        @keyframes popupAnimation {

            from {
                transform: scale(0.5);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }

        }


        .success-icon {

            width: 75px;
            height: 75px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: linear-gradient(
                135deg,
                #00b09b,
                #96c93d
            );

            color: white;

            font-size: 48px;

            font-weight: bold;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        .success-box h2 {

            color: #6a11cb;

            margin-bottom: 10px;

        }


        .success-box p {

            color: #555;

            font-size: 16px;

            margin-bottom: 25px;

        }


        #closeSuccess {

            border: none;

            background: linear-gradient(
                135deg,
                #6a11cb,
                #2575fc
            );

            color: white;

            padding: 12px 30px;

            border-radius: 25px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        #closeSuccess:hover {

            transform: scale(1.05);

        }

    </style>

</head>


<body>


    <!-- ===============================
         HEADER
    ================================ -->

    <header>

        <h1>StudentHub</h1>

        <p>Create your student account</p>

    </header>


    <!-- ===============================
         MAIN
    ================================ -->

    <main>

        <section>

            <h2>Registration</h2>


            <form id="registerForm">


                <!-- NAME -->

                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >


                <!-- EMAIL -->

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <!-- PASSWORD -->

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >


                <!-- BUTTONS -->

                <input
                    type="submit"
                    value="Register"
                >

                <input
                    type="reset"
                    value="Reset"
                >

            </form>

        </section>

    </main>


    <!-- ===============================
         FOOTER
    ================================ -->

    <footer>

        <p>
            © 2026 StudentHub Portal
        </p>

    </footer>


    <!-- ===============================
         SUCCESS POPUP
    ================================ -->

    <div id="successPopup">

        <div class="success-box">

            <div class="success-icon">
                ✓
            </div>

            <h2>
                Registration Successful! 🎉
            </h2>

            <p>
                Your StudentHub account has been
                created successfully.
            </p>

            <button
                type="button"
                id="closeSuccess">

                Continue

            </button>

        </div>

    </div>


    <!-- ===============================
         JAVASCRIPT
    ================================ -->

    <script>

        // Get the registration form
        const registerForm =
            document.getElementById("registerForm");


        // Get the popup
        const successPopup =
            document.getElementById("successPopup");


        // Get close button
        const closeSuccess =
            document.getElementById("closeSuccess");


        // =================================
        // REGISTER BUTTON
        // =================================

        registerForm.addEventListener(
            "submit",
            function(event) {

                // Stop page from refreshing
                event.preventDefault();


                // Get input values
                const name =
                    document.getElementById("name").value.trim();

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value.trim();


                // =================================
                // VALIDATION
                // =================================

                if (
                    name === "" ||
                    email === "" ||
                    password === ""
                ) {

                    alert(
                        "Please fill all the fields."
                    );

                    return;

                }


                // =================================
                // SHOW SUCCESS POPUP
                // =================================

                successPopup.classList.add("show");

            }
        );


        // =================================
        // CLOSE POPUP
        // =================================

        closeSuccess.addEventListener(
            "click",
            function() {

                successPopup.classList.remove(
                    "show"
                );

                // Clear the form
                registerForm.reset();

            }
        );


        // =================================
        // CLOSE POPUP BY CLICKING OUTSIDE
        // =================================

        successPopup.addEventListener(
            "click",
            function(event) {

                if (
                    event.target === successPopup
                ) {

                    successPopup.classList.remove(
                        "show"
                    );

                }

            }
        );

    </script>


</body>

</html>
