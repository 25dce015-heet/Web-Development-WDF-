<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>StudentHub | Register</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/forms.css">

    <script src="js/validation.js" defer></script>

</head>

<body>

<header>

    <h1>StudentHub Portal</h1>

    <p>Create Your Student Account</p>

</header>


<main>

<section>

    <h2>Student Registration</h2>

    <form
        id="registerForm"
        action="register.php"
        method="POST"
    >

        <label for="name">
            Full Name
        </label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            required
        >


        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >


        <label for="mobile">
            Mobile Number
        </label>

        <input
            type="tel"
            id="mobile"
            name="mobile"
            maxlength="10"
            placeholder="Enter 10 digit mobile number"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Minimum 6 characters"
            required
        >


        <label for="course">
            Course
        </label>

        <select
            id="course"
            name="course"
            required
        >

            <option value="">
                Select Course
            </option>

            <option value="B.Tech">
                B.Tech
            </option>

            <option value="BCA">
                BCA
            </option>

            <option value="BBA">
                BBA
            </option>

            <option value="B.Com">
                B.Com
            </option>

        </select>


        <label for="year">
            Year
        </label>

        <select
            id="year"
            name="year"
            required
        >

            <option value="">
                Select Year
            </option>

            <option value="First Year">
                First Year
            </option>

            <option value="Second Year">
                Second Year
            </option>

            <option value="Third Year">
                Third Year
            </option>

            <option value="Fourth Year">
                Fourth Year
            </option>

        </select>


        <fieldset>

            <legend>
                Gender
            </legend>

            <label>

                <input
                    type="radio"
                    name="gender"
                    value="Male"
                    required
                >

                Male

            </label>


            <label>

                <input
                    type="radio"
                    name="gender"
                    value="Female"
                >

                Female

            </label>


            <label>

                <input
                    type="radio"
                    name="gender"
                    value="Other"
                >

                Other

            </label>

        </fieldset>


        <br>

        <label>

            <input
                type="checkbox"
                name="terms"
                required
            >

            I accept the terms and conditions.

        </label>


        <br><br>

        <input
            type="submit"
            value="Register"
        >

        <input
            type="reset"
            value="Reset"
        >

    </form>


    <p>

        Already have an account?

        <a href="login.html">
            Login here
        </a>

    </p>

</section>

</main>


<footer>

    <p>
        © 2026 StudentHub Portal
    </p>

</footer>

</body>

</html>
