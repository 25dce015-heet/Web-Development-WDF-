<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        StudentHub | Contact
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<header>

    <h1>
        StudentHub Portal
    </h1>

    <p>
        Contact Us
    </p>

</header>


<main>

<section>

    <h2>
        Contact Form
    </h2>

    <form
        action="contact.php"
        method="POST"
    >

        <label for="name">
            Name
        </label>

        <input
            type="text"
            id="name"
            name="name"
            required
        >


        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            required
        >


        <label for="message">
            Message
        </label>

        <textarea
            id="message"
            name="message"
            rows="6"
            required
        ></textarea>


        <br><br>

        <input
            type="submit"
            value="Send Message"
        >

    </form>

</section>

</main>


<footer>

    <p>
        © 2026 StudentHub Portal
    </p>

</footer>

</body>

</html>
