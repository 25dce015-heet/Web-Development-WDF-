<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>StudentHub | Login</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

    <h1>StudentHub Portal</h1>

    <p>Student Login</p>

</header>


<main>

<section>

    <h2>Login</h2>

    <form
        action="login.php"
        method="POST"
    >

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
        >


        <br><br>

        <input
            type="submit"
            value="Login"
        >

        <input
            type="reset"
            value="Reset"
        >

    </form>


    <p>

        Don't have an account?

        <a href="register.html">
            Register here
        </a>

    </p>

</section>

</main>


<footer>

    <p>
        © 2026 StudentHub Portal
    </p>

</footer>

</body>

</html>
