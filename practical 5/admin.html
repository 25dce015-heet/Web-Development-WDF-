<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        StudentHub | Admin
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/admin.css"
    >

</head>

<body>

<header class="admin-header">

    <h1>
        StudentHub Admin
    </h1>

    <p>
        Administrator Dashboard
    </p>

</header>


<main>

<div class="admin-grid">

    <div class="admin-card">

        <h3>
            👨‍🎓 Students
        </h3>

        <p>
            250 Registered Students
        </p>

    </div>


    <div class="admin-card">

        <h3>
            👨‍🏫 Faculty
        </h3>

        <p>
            35 Faculty Members
        </p>

    </div>


    <div class="admin-card">

        <h3>
            📚 Courses
        </h3>

        <p>
            18 Active Courses
        </p>

    </div>


    <div class="admin-card">

        <h3>
            📅 Events
        </h3>

        <p>
            15 Upcoming Events
        </p>

    </div>


    <div class="admin-card">

        <h3>
            📝 Assignments
        </h3>

        <p>
            42 Active Assignments
        </p>

    </div>


    <div class="admin-card">

        <h3>
            📊 Reports
        </h3>

        <p>
            Generate Student Reports
        </p>

    </div>

</div>

</main>


<footer>

    <p>
        © 2026 StudentHub Portal
    </p>

</footer>

</body>

</html>
